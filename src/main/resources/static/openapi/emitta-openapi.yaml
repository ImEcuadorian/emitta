openapi: 3.0.3

info:
  title: Emitta API
  version: 1.0.0
  description: |
    API for asynchronous electronic fiscal document issuance in Ecuador.

    A successful HTTP response means the invoice was accepted by Emitta
    for fiscal processing. It does not mean that the SRI has authorized it.

servers:
  - url: http://localhost:18080
    description: Local development

tags:
  - name: Authentication
    description: Machine-to-machine authentication

  - name: Invoices
    description: Electronic invoice issuance

paths:

  /api/v1/auth/token:

    post:
      tags:
        - Authentication

      operationId: issueAccessToken

      summary: Issue a machine-to-machine access token

      description: |
        Authenticates an API client using its client identifier and secret.

        Successful authentication returns a short-lived RS256 JWT.
        This endpoint is intentionally public because it is the authentication
        entry point.

      security: [ ]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            example:
              clientId: faxorf-local
              clientSecret: local-development-secret

      responses:

        "200":
          description: Access token issued
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "401":
          description: Invalid client credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/v1/invoices:

    post:
      tags:
        - Invoices

      operationId: createInvoice

      summary: Create an electronic invoice

      description: |
        Creates an immutable invoice business snapshot and queues it
        for asynchronous fiscal processing.

        The authenticated JWT determines the tenant. A tenant identifier
        must never be supplied by the request body.

        The Idempotency-Key header is mandatory.

        A new invoice returns 202 Accepted.

        An exact replay using the same Idempotency-Key returns 200 OK
        and the existing invoice resource.

      security:
        - bearerAuth: []

      parameters:

        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Tenant-scoped idempotency key. Reusing the same key with
            different business content returns 409 Conflict.
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: sale-2026-000001

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
            examples:

              standardInvoice:
                summary: Standard 15 percent VAT invoice
                value:
                  pointOfIssueId: "4e10fa1e-b488-48ec-a79e-364eb434ef58"
                  environment: TEST
                  issuedAt: "2026-10-05T20:00:00Z"
                  buyer:
                    identificationType: "07"
                    identification: "9999999999999"
                    name: "CONSUMIDOR FINAL"
                  items:
                    - sku: "P001"
                      description: "Producto de prueba"
                      quantity: 2
                      unitPrice: 10.00
                      discount: 2.00
                      taxes:
                        - taxCode: "2"
                          percentageCode: "4"
                          rate: 15
                  payments:
                    - paymentMethod: "01"
                      total: 20.70
                  expectedTotal: 20.70

      responses:

        "200":
          description: |
            Idempotent replay. The invoice already existed and the
            supplied business content matched the original request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvoiceResponse"

        "202":
          description: |
            Invoice persisted and accepted for asynchronous fiscal processing.
            This does not mean that the SRI has authorized the invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvoiceResponse"

        "400":
          description: Malformed request or transport-level validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "403":
          description: Authenticated client is not allowed to perform the operation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "404":
          description: Fiscal resource was not found in the authenticated tenant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "409":
          description: Idempotency key was reused with different request content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "422":
          description: |
            Request is structurally valid but violates a fiscal or
            business invariant, such as expectedTotal mismatch.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    TokenRequest:
      type: object
      additionalProperties: false
      required:
        - clientId
        - clientSecret
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 100
        clientSecret:
          type: string
          minLength: 1
          maxLength: 500
          writeOnly: true

    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Short-lived RS256 JWT
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          example: 900

    CreateInvoiceRequest:
      type: object
      additionalProperties: false

      required:
        - pointOfIssueId
        - environment
        - issuedAt
        - buyer
        - items
        - payments

      properties:

        pointOfIssueId:
          type: string
          format: uuid

        environment:
          type: string
          enum:
            - TEST
            - PRODUCTION

        issuedAt:
          type: string
          format: date-time

        customerId:
          type: string
          format: uuid
          nullable: true

        buyer:
          $ref: "#/components/schemas/InvoiceBuyer"

        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceItem"

        payments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoicePayment"

        expectedTotal:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          nullable: true
          description: |
            Optional client-side verification value.
            Emitta calculates the authoritative total.

    InvoiceBuyer:
      type: object
      additionalProperties: false

      required:
        - identificationType
        - identification
        - name

      properties:

        identificationType:
          type: string
          pattern: "^[0-9]{2}$"

        identification:
          type: string
          minLength: 1
          maxLength: 30

        name:
          type: string
          minLength: 1
          maxLength: 300

        email:
          type: string
          format: email
          maxLength: 320
          nullable: true

        address:
          type: string
          maxLength: 500
          nullable: true

    InvoiceItem:
      type: object
      additionalProperties: false

      required:
        - description
        - quantity
        - unitPrice
        - discount
        - taxes

      properties:

        sku:
          type: string
          maxLength: 25
          nullable: true

        description:
          type: string
          minLength: 1
          maxLength: 300

        quantity:
          type: number
          exclusiveMinimum: 0

        unitPrice:
          type: number
          minimum: 0

        discount:
          type: number
          minimum: 0
          multipleOf: 0.01

        taxes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceTax"

    InvoiceTax:
      type: object
      additionalProperties: false

      required:
        - taxCode
        - percentageCode
        - rate

      properties:

        taxCode:
          type: string
          pattern: "^[0-9]{1,4}$"

        percentageCode:
          type: string
          pattern: "^[0-9]{1,4}$"

        rate:
          type: number
          minimum: 0

    InvoicePayment:
      type: object
      additionalProperties: false

      required:
        - paymentMethod
        - total

      properties:

        paymentMethod:
          type: string
          pattern: "^[0-9]{2}$"

        total:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01

        term:
          type: number
          minimum: 0
          nullable: true

        unitTime:
          type: string
          minLength: 1
          maxLength: 10
          nullable: true

    CreateInvoiceResponse:
      type: object
      additionalProperties: false

      required:
        - id
        - status
        - total
        - created

      properties:

        id:
          type: string
          format: uuid

        status:
          $ref: "#/components/schemas/DocumentStatus"

        total:
          type: number
          multipleOf: 0.01

        created:
          type: boolean
          description: |
            true when this request created the invoice.
            false when this response is an idempotent replay.

    DocumentStatus:
      type: string
      enum:
        - RECEIVED
        - QUEUED
        - GENERATING
        - SIGNED
        - SUBMITTED
        - RETRY_PENDING
        - AUTHORIZED
        - REJECTED
        - FAILED

    ProblemDetails:
      type: object

      properties:

        type:
          type: string
          format: uri

        title:
          type: string

        status:
          type: integer
          format: int32

        detail:
          type: string

        instance:
          type: string
          format: uri

        code:
          type: string